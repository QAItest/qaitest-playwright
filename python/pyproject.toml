[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qaitest-playwright-python"
version = "0.1.0"
description = "Python Playwright starter with pytest and pytest-bdd."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QAItest" }]
dependencies = [
  "playwright>=1.58.0",
  "pytest>=8.0.0",
  "pytest-bdd>=8.1.0",
  "pytest-playwright>=0.7.0",
  "PyYAML>=6.0",
  "requests>=2.31.0"
]

[project.scripts]
playwright-bdd = "tests.run_bdd:main"
playwright-export = "utils.export_test_xray:main"
playwright-import = "utils.import_test_xray:main"
playwright-sanitize = "utils.gherkin_sanitizer:main"

[tool.setuptools.packages.find]
include = ["tests", "tests.*", "utils", "utils.*"]
